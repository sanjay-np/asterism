# asterism — copy to ~/.config/asterism/config.toml and change what you like.
# Every line is optional: a missing value keeps the default. The bar reads this file again
# within a couple of seconds of a change, no restart needed.

# "line": a slim solid strip with a hairline under it, menus floating just off it as
# outlined cards (the default). "frame": a thin frame round the whole screen with rounded
# inner corners, menus hanging from the bar like drawers. "floating": one rounded bar off
# the edge. "islands": each end and the middle on a pill of its own. "transparent": no
# surface, the bar straight on the wallpaper.
style = "line"
frame = 8                 # style = "frame": the frame's thickness
frame_radius = 22         # and its inner corners' radius

size = "normal"           # compact, normal or large
position = "top"          # top or bottom
page_style = "dots"       # dots (busy workspaces joined by a line), numbers, or kanji (一 二 三…)
pages = 8                 # workspaces always shown (4 to 10): niri's, then empty places up to this; Hyprland: a group
percent = true            # numbers beside volume, battery and resources
media_title = "scroll"    # scroll, short or off
tray_tint = false         # background apps drawn in the bar's colour
hot_corner = true         # the bar's top-right corner opens the control centre
song_popup = true         # a card with the cover and the title for a moment when the song changes
polkit_agent = true       # ask for passwords when apps need an administrator's say
font = "Google Sans Flex" # ships with the bar, as does Poppins; any installed family works
icons = "outline"         # outline (thin Material), material (rounded) or phosphor (filled)
outputs = []              # only these outputs, like ["DP-1"]; empty means all

[clock]
hours24 = true
seconds = false
date = "%A, %B %-d"       # strftime; "%a %-d %b" is shorter, "" hides the date

[layout]
# (Settings → Bar → Arrangement moves them by clicks and writes these three lists.)
# Modules: pages, clock (opens the calendar), day (your day: timers, to-do and notes, with how
# many tasks are left), weather, media, resources, tray, tools, status, launcher (an apps button)
left = ["launcher", "pages"]
center = ["resources", "clock", "day", "weather", "media"]
right = ["tools", "tray", "status"]

# The status items, in order: notifications (needs swaync), keyboard (shown with two
# layouts or more), network, bluetooth, volume, battery, control (the control centre),
# settings (needs a command below), session.
# status = ["notifications", "keyboard", "network", "bluetooth", "volume", "battery", "control", "session"]

# The resources: cpu, memory, temperature, network
# resources = ["cpu", "memory", "temperature", "network"]

# Tools: leave them out to get ones that suit your compositor (screenshot and colour
# picker, the microphone, staying awake). Tools whose programs aren't installed are hidden.
# `kind` can be "microphone" or "awake" for the built-in toggles.
#
# [[tools]]
# icon = "capture"
# label = "Screenshot"
# command = "niri msg action screenshot"
#
# [[tools]]
# icon = "picker"
# label = "Pick a colour"
# command = "hyprpicker -a"
#
# [[tools]]
# icon = "coffee"
# label = "Stay awake"
# kind = "awake"
#
# Icons available: add apps battery-* bell bell-slash bluetooth* brightness calendar
# capture caret-left caret-right check checklist clipboard close cloud* coffee cpu down
# energy fingerprint gear-six image keyboard layout lock logout lyrics microphone
# microphone-off moon music nightlight pause picker play plugs-connected power ram
# refresh restart search skip-back skip-forward sleep speaker-* speed sun timer up wifi-*

[commands]
# Run through `sh -c`. Empty settings/network/bluetooth/monitor hide their entries.
settings = ""
network = ""              # like "nm-connection-editor"
bluetooth = ""            # like "blueman-manager"
monitor = ""              # like "kitty -e btop"
notifications = ""        # replaces the swaync panel toggle
lock = "loginctl lock-session"
suspend = "systemctl suspend"
logout = ""               # empty: niri `quit`, Hyprland `exit`
reboot = "systemctl reboot"
poweroff = "systemctl poweroff"

[notifications]
daemon = true             # be the notification daemon when no other one runs
timeout = 6               # seconds a pop-up stays when the app doesn't say
max_popups = 4
battery_low = 15          # percent for a "battery low" warning; 0 turns it off
battery_critical = 5      # and for an urgent one that stays until you answer

# What to do with an app's notifications, by its name (case doesn't matter):
# "silence" keeps them in the centre without a pop-up, "discard" drops them.
[notifications.apps]
# Spotify = "silence"
# "Some Chatty App" = "discard"

[wallpaper]
enabled = true            # off keeps another program's wallpaper
image = ""                # a picture, like "~/Pictures/Wallpapers/sea.jpg"; the colours come from it
fit = "cover"             # cover, contain or stretch
# The wallpaper changer (control centre tile, or `asterism msg wallpaper`) shows the pictures
# in this folder; empty uses the picture's own folder, else ~/Pictures/Wallpapers. A picture
# chosen there is remembered without touching this file (edit `image` and yours wins again).
directory = ""
interval = 0              # minutes between changing to another picture at random; 0 never
transition = "random"     # how pictures change: random (a different one each time), fade, wipe,
                          # circle, blinds, ink, pixels, slide, or none
transition_ms = 1200      # how long that takes
# A video (mp4, webm, mkv, mov…; needs ffmpeg) or an animated GIF as the `image` plays as a
# live wallpaper. It's still while windows cover it, and while these hold it:
live = true               # off: its first frame stays still
live_fps = 30             # a video's frames a second, 5 to 60 (a GIF keeps its own timing)
live_scale = 75           # a video (or big GIF) made at this % of the screen's width and height, 25 to 100,
                          # and scaled up by the compositor (blurrier the further); 100 is sharp, about twice the cost
live_battery = false      # play on battery too
live_idle = 5             # minutes without input before it stops until you're back; 0 never
grain = 1.0               # film grain against banding, 0 to 2
# Without a picture you get a quiet gradient in the scheme's colours. Or, for a painted
# landscape of the `planet` below instead:
# world = true
# planet = "vesper"       # (top level, not here) aster, nere, ocre or vesper
# terrain = 0.34          # how much of the screen the hills take, 0 to 0.8
# relief = 1.0            # 0 smooth, 1 normal, 2 wild
# stars = 0.0             # 0 to 2

[launcher]
terminal = ""             # for terminal apps; empty finds one ($TERMINAL, kitty, foot…)
search = "https://duckduckgo.com/?q={}"

[colors]
# The whole scheme (a dark Material 3 "tonal spot" one) grows from one colour: the one that
# stands out most in your wallpaper image, or this. As "#rrggbb".
# accent = "#4a6fd9"
# Then single roles can be overridden, as "#rrggbb" or "#rrggbbaa":
# surface = "#141218"     # the bar, and the frame
# card = "#211f26"        # menus, panels and pop-ups
# text = "#e6e0e9"
# text_soft = "#cac4d0"
# warn = "#f2b8b5"
# The bar's icons in the wallpaper's colours: "tinted" (leaning toward them, the default),
# "accent" (its accent colour), "colourful" (status, machine and tools a colour each) or "plain".
bar_icons = "tinted"
# The widgets' clock, headings and cards in the wallpaper's colours ("tinted"), or "plain".
widgets = "tinted"
# The scheme for other apps too, as files of their own beside their configs (yours aren't
# touched); include them once and they follow every wallpaper change:
#   kitty      ~/.config/kitty/asterism-colors.conf      kitty.conf: include asterism-colors.conf
#   foot       ~/.config/foot/asterism-colors.ini        foot.ini: include=~/.config/foot/asterism-colors.ini
#   alacritty  ~/.config/alacritty/asterism-colors.toml  alacritty.toml: [general] import = ["…"]
#   gtk        ~/.config/gtk-{3,4}.0/asterism-colors.css gtk.css: @import url("asterism-colors.css");
# kitty reads it again at once; Alacritty follows the file; foot and GTK apps at their next start.
apps = []                 # any of kitty, foot, alacritty, gtk

[pet]
# Companions living on the screen above your windows (clicks pass through all but them), as many
# as you like: a "cat", a "fox", a "panda", a "tiger" or a "lion" along the foot of the screen,
# a "bird" flying about and perching on the bar. Each has energy, hunger and wants attention: it
# naps, asks to be fed, comes to find you. It sleeps after a minute without input (and stretches
# and yawns when you're back), gets the zoomies when the machine is busy, sways to music, perks
# up at notifications, and stalks and pounces on the pointer over the desktop and the bar; they
# greet, chase and nap beside each other. Click one to stroke it; drag it to pick it up;
# right-click for food, a ball, another animal, another pet, or to put it away.
# Each is "animal" or "animal:coat". Coats: cat: tabby, ginger, black, white, tuxedo, siamese;
# fox: red, arctic; bird: sparrow, robin, bluebird; panda: giant, brown; tiger: bengal, white;
# lion: lion, lioness; any: wallpaper. No coat: the first.
pets = []                 # e.g. ["cat:ginger", "fox", "panda", "lion:lioness"]
sounds = true             # meows, yips, chirps, roars, bleats now and then; never in do-not-disturb
volume = 40               # percent
size = 100                # percent, 70 to 140
bed = -1                  # their bed's place, in thousandths of the screen's width; -1 none
                          # (a pet's menu puts one down: "Give them a bed")
# Older configs name two pets instead: animal = "cat", coat = "", friend = "fox", friend_coat = "".
# They're read only while there's no `pets` line.

[lock]
idle = 10                 # minutes without input before the screen locks, plugged in; 0 never
idle_battery = 5          # the same on battery
before_sleep = true       # lock before the machine sleeps (closing the lid too)
fingerprint = true        # unlock with a fingerprint too, when fprintd has a reader and your fingers
# Locked out? Ctrl+Alt+F3, log in, and run `asterism unlock`.

# While you're away (locking is [lock]'s), and what the lid and the power button do. Minutes
# without input; 0 leaves a step out. A video playing and Stay awake hold every step off, and
# any input undoes a dim or the screens going off. Settings → Power has all of it.
[power]
dim = 5                   # plugged in: dim the screens…
off = 15                  # …turn them off…
suspend = 30              # …and sleep (not while music plays)
dim_battery = 2           # the same on battery
off_battery = 7
suspend_battery = 15
dim_level = 30            # dimmed, a screen keeps this share (%) of its brightness; screens with
                          # no backlight (an external monitor) get a dark veil about as dark
off_locked = 1            # once locked, the screens go off after this many minutes; 0 waits for `off`
# The lid: "system" (as logind is set), "suspend", "hibernate", "lock" or "nothing". Anything
# but "system" makes Asterism hold the lid from logind while it runs.
lid = "system"            # closed on battery
lid_plugged = "same"      # closed while plugged in ("same": as on battery)
lid_docked = "system"     # closed with another screen plugged in
# The power button: "system", "menu" (the session menu), "suspend", "hibernate", "poweroff",
# "lock" or "nothing". Anything but "system" also needs the key bound in the compositor, e.g. niri:
#   XF86PowerOff allow-when-locked=true { spawn "asterism" "msg" "power" "button"; }
button = "system"

[night_light]
mode = "off"              # off, on, or schedule (from start to end)
temperature = 4000        # kelvin at night: 6500 is the screen as it is, 3000 very warm
start = "sunset"          # "HH:MM", or sunset / sunrise where the weather is
end = "sunrise"

[weather]
enabled = true
city = ""                 # empty: the city your time zone is named after
# latitude = 27.7         # or exact coordinates, which win over the name
# longitude = 85.3
units = "metric"          # metric (°C, km/h) or imperial (°F, mph)

[day]
# The day panel, in the middle under the clock: the month, timers, a to-do list and notes. Opens from the bar's
# top-left corner, a click on the clock (a right click shows the calendar alone), or
# `asterism msg day`. The list and notes are plain files you can edit anywhere: todo.md (a
# Markdown checklist, "- [ ] task" / "- [x] done") and notes.md.
folder = ""               # where they live; empty takes ~/Documents/Asterism
corner = true             # the top-left corner opens it

[privacy]
# A pill at the start of the bar's status icons while an app uses the microphone, a camera or
# the screen (shared or recorded), one icon for each. Hover it for the apps; click it for the
# list (mute the microphone, stop sharing on niri); right-click mutes the microphone.
microphone = true
camera = true
screen = true             # niri says what's cast and lets it be stopped; Hyprland only that it is

[blur]
# Frosted glass: the compositor blurs what's behind these (niri 26, and others with
# ext-background-effect; on Hyprland use layer rules: `layerrule = blur, asterism-dock` and
# asterism-launcher, asterism-overview, asterism-wallpapers, asterism-control,
# asterism-notifications). The widgets: [widgets] blur.
dock = false              # the dock's card (drawn see-through so the blur shows)
launcher = false          # the app grid
overview = false          # the windows' overview
wallpapers = false        # the wallpaper picker
control = false           # the control centre's card (not with the frame style)
notifications = false     # notification pop-ups and the notification centre

[dock]
# The dock on an edge of the screen (the foot by default), hidden until the pointer touches the
# edge by it (or `asterism msg dock`). Pinned apps stay; open apps join them with a dot per
# window. Click: go to the app (again: its next window), or start it; middle click: a new one;
# right click: its windows, pin or unpin, close. Drag an icon along to reorder (dropping an open
# app among the pinned pins it), or off the dock, away from the edge, to unpin it.
enabled = true
pinned = []               # desktop file ids, e.g. ["firefox", "kitty", "org.gnome.Nautilus"]
position = "bottom"       # the edge it sits on: bottom, top, left or right
autohide = true           # false: always up, and windows are kept clear of it
hide_delay = 450          # milliseconds it stays after the pointer leaves
running = true            # open apps that aren't pinned show too
size = 44                 # icon size
magnify = true            # icons grow under the pointer
launcher = true           # an apps button at its start
trash = true              # the trash at its end: click opens it, right click empties it
corners = "rounded"       # rounded, small, square or pill
background = "card"       # card (edged, with a soft shadow), flat, glass (see-through) or none
attached = false          # true: sits on the screen's edge, its lower corners square
indicator = "dots"        # the open windows' marks: dots, line or none
separators = true         # thin lines between the apps button, pinned, open apps and the trash

[timers]
focus = 25                # minutes of focus in the focus timer
short_break = 5
long_break = 15
rounds = 4                # a long break after this many rounds

[widgets]
# On the desktop, under your windows; drag one to move it (it stays where you leave it).
# Right-click a widget or the wallpaper for the desktop's menu; "Arrange widgets" there (or
# `asterism msg widgets edit`) adds, takes off, moves and resizes (by their sides and corners) them all.
# "visualizer": bars that move with the music while something plays, in a card; "edge": the
# same along the foot of the screen (both listen to the speakers through parec or pw-record,
# only then). "photos": a picture from a folder; "note": a sticky note.
show = ["clock", "weather", "media"]   # any of clock, weather, media, visualizer, edge, calendar, system, photos, note; [] for none
lyrics = true             # song words under what's playing, from LRCLIB (sends the song's name)
photos = ""               # the photo frame's folder; empty takes ~/Pictures (PNG and JPEG)
photo_minutes = 10        # how long each picture stays
note = ""                 # what the sticky note says; use """…""" for several lines
opacity = 60              # how solid the cards are, 0 (see-through: words with a soft shadow) to 100
outline = true            # a hairline round each card
blur = false              # frosted glass: the compositor blurs what's behind each card (niri 26+;
                          # on Hyprland, `layerrule = blur, asterism-desktop` instead)
