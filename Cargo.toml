[package]
name = "asterism"
version = "0.1.0"
edition = "2024"
description = "A quiet, minimal desktop shell in pure Rust for niri and Hyprland"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cosmic-text = "0.19.0"
env_logger = "0.11.11"
futures-lite = "2"
gif = "0.14"
log = "0.4.35"
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }
resvg = { version = "0.50.0", default-features = false, features = ["raster-images"] }
rustix = { version = "1", features = ["process", "fs", "pipe", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "net", "process", "time", "macros", "sync", "io-util"] }
toml = "1.2.1"
toml_edit = "0.25"
# Already in the tree through smithay-client-toolkit; "staging" adds ext-background-effect (blur)
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zune-jpeg = "0.5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
